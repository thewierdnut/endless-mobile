plugins {
   id 'com.android.application'
}

android {
    namespace = "com.github.thewierdnut.endless_mobile"
    compileSdkVersion 30
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    ndkVersion "26.3.11579264"
    defaultConfig {
        applicationId "com.github.thewierdnut.endless_mobile"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 62
        versionName "0.11.3-62"
        externalNativeBuild {
            // ndkBuild {
            //     arguments "APP_PLATFORM=android-18"
            //     abiFilters 'arm64-v8a'
            //     // abiFilters 'armeabi-v7a', 'arm64-v8a'
            // }
            cmake {
                arguments "-DANDROID_APP_PLATFORM=android-18", "-DANDROID_STL=c++_static", "-DCMAKE_BUILD_TYPE=Release", "-DSDL_SHARED=0"
                // Each abi we enable increases the apk size by 20 meg
                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            // ndkBuild {
            //     path 'jni/Android.mk'
            // }
            cmake {
                path 'jni/CMakeLists.txt'
            }
        }

    }
    lintOptions {
        abortOnError false
    }

    aaptOptions {
        ignoreAssetsPattern "!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~"
    }
    //packagingOptions{
    //    doNotStrip "*/*/*.so"
    //}

    signingConfigs {
        debug
        {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}